<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>약관 및 정책</title><style>
:root{--text:#18202A;--sub:#3F4A57;--muted:#5B6573;--line:#E3E8EE;--accent:#1F6FC9;--soft:#F2F7FC;--bg:#FFFFFF}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.7;font-size:15px;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 64px}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px}
.brand b{color:var(--accent);font-weight:700}
nav.tabs{display:flex;gap:6px;margin:14px 0 22px}
nav.tabs a{flex:1;text-align:center;padding:9px 0;border-radius:10px;background:#F2F4F6;color:var(--muted);text-decoration:none;font-size:14px;font-weight:600}
nav.tabs a.on{background:var(--accent);color:#fff}
h1{font-size:24px;line-height:1.4;margin:0 0 6px}
h2{font-size:17px;margin:30px 0 8px;padding-top:4px}
h2#summary{display:none}
p,li{color:var(--sub)}
ul,ol{padding-left:20px}
li{margin:3px 0}
a{color:var(--accent)}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top;color:var(--sub)}
th{background:#F7F9FB;color:var(--text);font-weight:600;white-space:nowrap}
.summary{background:var(--soft);border-radius:14px;padding:4px 18px 8px;margin:18px 0 8px}
.summary h3{font-size:14px;margin:12px 0 2px;color:var(--text)}
footer{margin-top:40px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
</style></head><body><div class="wrap"><h1>약관 및 정책</h1><ul><li><a href="fiftynine/">59분</a></li></ul></div></body></html>
